name: Bug Report
description: Report a bug in a Smart Boot Menu component
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the bug.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware / VM Platform
      description: e.g., QEMU OVMF x86_64, QEMU AAVMF arm64, HP laptop model, Apple Silicon Mac model
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Diagnostics (redact private keys and serial numbers)
