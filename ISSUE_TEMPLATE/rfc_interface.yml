name: RFC / Interface Change Proposal
description: Propose an architectural decision, new component, or shared interface change
labels: ["rfc", "architecture"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation & Problem Statement
    validations:
      required: true
  - type: textarea
    id: build_vs_reuse
    attributes:
      label: Build vs. Reuse Evaluation (ADR-010)
      description: List the strongest existing open-source alternatives evaluated across languages/ecosystems (with licensing and maintenance status). Explain where the proposal sits in the ADR-010 order of preference (reuse -> compose -> thin wrapper -> upstream -> fork -> original implementation), total cost of ownership, and empirical baselines if claiming advantages.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      description: Include affected specs/ADRs in `docs`, types in `sbm-common`, and downstream repositories.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, Safety, Licensing & Offline Impact
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Backward Compatibility & Versioning
    validations:
      required: true
